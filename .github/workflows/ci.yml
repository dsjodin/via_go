name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Honours the go and toolchain directives in go.mod.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: install
        working-directory: ui
        run: npm ci
      - name: lint
        working-directory: ui
        run: npm run lint
      - name: build
        working-directory: ui
        run: npm run build

      # A navigation entry whose page is not in the repository builds fine and
      # 404s in production. It happened: .gitignore matched the Images route's
      # directory, so the file existed on one machine and in no clone. This
      # step runs against the checkout, which is the thing that was wrong.
      - name: every navigation target has a page
        working-directory: ui
        run: |
          grep -o 'href: "/[a-z-]*"' src/components/Shell.jsx | cut -d'"' -f2 |
          while read -r href; do
            test -f "out${href}/index.html" \
              || { echo "::error::no page exported for the $href navigation entry"; exit 1; }
          done

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is never published, but it is a documented install route, so
      # the build has to keep working. Nothing checked this before and the
      # previous Dockerfile had rotted into something that could not be built
      # on its own at all.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
