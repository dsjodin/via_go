version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  settings:
    staticcheck:
      # The golangci-lint default set, plus one exclusion.
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        # Selectors that name the embedded form struct (item.GroupForm.Vlan)
        # are deliberate here: they mark the fields that are overwritten
        # unconditionally because mergo will not clear a value with an empty
        # one. Dropping the qualifier would hide that distinction.
        - "-QF1008"

formatters:
  enable:
    - gofmt
