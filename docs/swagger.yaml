      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: integer
      password:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.UserForm:
    properties:
      comment:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
