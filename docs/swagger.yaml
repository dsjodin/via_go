      vendor_class:
        type: string
    type: object
  model.Group:
    properties:
      bootdisk:
        type: string
      bootmethod:
        type: string
      callbackurl:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      device:
        type: string
      dns:
        type: string
      gateway:
        type: string
      host:
        items:
          $ref: '#/definitions/model.Host'
        type: array
      id:
        type: integer
      image_id:
        type: integer
      ks:
        type: string
      name:
        type: string
      netmask:
        type: string
      ntp:
        type: string
      options:
        additionalProperties:
          type: string
        type: object
      syslog:
        type: string
      updated_at:
        type: string
      vlan:
        type: string
    type: object
  model.GroupRequest:
    properties:
      bootdisk:
        type: string
      bootmethod:
        type: string
      callbackurl:
        type: string
      device:
        type: string
      dns:
        type: string
      gateway:
        type: string
      image_id:
        type: integer
      ks:
        type: string
      name:
        type: string
      netmask:
        type: string
      ntp:
        type: string
      options:
        additionalProperties:
          type: string
        type: object
      password:
        description: |-
          Password is the ESXi root password, in the clear on the way in. It is
          encrypted before it reaches the database and never sent back out.
        type: string
      syslog:
        type: string
      vlan:
        type: string
    type: object
  model.Host:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      domain:
        type: string
      expires_at:
        type: string
      first_seen:
        type: string
      group:
        $ref: '#/definitions/model.Group'
      group_id:
        type: integer
      hostname:
        type: string
      id:
        type: integer
      ip:
        type: string
      ks:
        type: string
      last_seen:
        type: string
      last_seen_relay:
        description: DHCP parameters
        type: string
      mac:
        type: string
      missing_options:
        type: string
      progress:
        type: integer
      progresstext:
        type: string
      reimage:
        type: boolean
      updated_at:
        type: string
    type: object
  model.HostForm:
    properties:
      domain:
        type: string
      group_id:
        type: integer
      hostname:
        type: string
      ip:
        type: string
      ks:
        type: string
      mac:
        type: string
      progress:
        type: integer
      progresstext:
        type: string
      reimage:
        type: boolean
    type: object
  model.Image:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      hash:
        type: string
      id:
        type: integer
      iso_image:
        type: string
      path:
        type: string
      size:
        type: integer
      updated_at:
        type: string
    type: object
  model.ImageForm:
    properties:
      description:
        type: string
      hash:
        type: string
      iso_image:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  model.User:
