version: 2

# The repository is via_go but the binary and docs are all go-via. Without
# this, goreleaser derives the name from the module path.
project_name: go-via

# The frontend is built by `go generate ./...` in CI before goreleaser runs;
# it needs a Node toolchain, so it is not a hook here.
before:
  hooks:
    - go mod download

builds:
  - id: go-via
    main: ./cmd/go-via
    binary: go-via
    env:
      # go-sqlite3 is cgo.
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.date={{.Date}}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

archives:
  - files:
      - config.example.json
