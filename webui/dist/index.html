<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>go-via</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16171a;
        color: #e6e6e6;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      code {
        background: #26282d;
        padding: 0.1rem 0.35rem;
        border-radius: 3px;
      }
      pre {
        background: #26282d;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        overflow-x: auto;
      }
      a { color: #7cc4ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>go-via</h1>
      <p>
        The frontend has not been built into this binary. The REST API and the
        DHCP, TFTP and UEFI boot services are unaffected and running normally.
      </p>
      <p>Build the UI and rebuild:</p>
      <pre>go generate ./...
go build</pre>
      <p>
        The API is documented at <a href="/swagger/index.html">/swagger</a>.
      </p>
    </main>
  </body>
